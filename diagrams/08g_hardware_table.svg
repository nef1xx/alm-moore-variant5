<text x="40" y="810" font-size="19" text-anchor="start">Yⱼ — активные выходы начального состояния; «—» — все сигналы в соответствующем столбце равны 0.</text>
<text x="40" y="841" font-size="19" text-anchor="start">В столбце RS указаны только активные входы: S₂/R₂ → q₂, S₁/R₁ → q₁, S₀/R₀ → q₀.</text>
<text x="40" y="872" font-size="19" text-anchor="start">¬ — НЕ; соседство F — И; ∨ — ИЛИ; 1 в столбце Fᵢ — любой набор F. «Неисп.» — код 111.</text>
<text x="40" y="903" font-size="19" text-anchor="start">При RESET = 1: переход в S₀ на фронте CLK; Sₖ = 0, Rₖ = qₖ. В S₆ автомат остаётся до сброса.</text>
<text x="40" y="934" font-size="19" text-anchor="start">Условия заданы на всех 8 наборах F; ветка S₅ → S₄ не достигается при реальных F(X).</text>
